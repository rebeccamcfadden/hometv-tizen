<!doctype html>
<!-- Emulator only (see config.xml): starts the service as TizenBrew's UI starts its own (an app control with the
     "service" operation), registers the module's keys, then moves to the module's page. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>HomeTV spike</title>
    <style>
      body { margin: 0; background: #0b0f1a; color: #e8ecf5; font: 32px sans-serif; }
      p { position: absolute; left: 96px; top: 54px; }
    </style>
  </head>
  <body>
    <p id="msg">Starting the HomeTV service…</p>
    <script>
      (function () {
        var msg = document.getElementById('msg');
        var keys = ['ColorF0Red', 'ColorF1Green', 'ColorF2Yellow', 'ColorF3Blue', 'Info'];
        function go() {
          location.href = 'dist/index.html';
        }
        try {
          keys.forEach(function (k) {
            try { tizen.tvinputdevice.registerKey(k); } catch (e) {}
          });
          var pkg = tizen.application.getCurrentApplication().appInfo.packageId;
          tizen.application.launchAppControl(
            new tizen.ApplicationControl('http://tizen.org/appcontrol/operation/service'),
            pkg + '.HomeTVService',
            function () { setTimeout(go, 500); },
            function (e) { msg.textContent = 'Service didn’t start: ' + e.message; setTimeout(go, 3000); }
          );
        } catch (e) {
          msg.textContent = 'No tizen here: ' + e.message;
          setTimeout(go, 1500);
        }
      })();
    </script>
  </body>
</html>
